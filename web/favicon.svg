<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
     width="48" height="48" role="img" aria-label="Qellys Book">
  <!-- ETHAN'S OWN ARTWORK, NOT A DRAWN MARK. 2026-08-23: "i really like
       the QB logo it has so we should use that for the site logo but take
       away where it says qellys book below it".

       Cropped from brand/appicon-1254.png at the empty band under the
       mark (rows 804-846 carry no ink), so the crown and the QB come
       through and the wordmark does not — the words already sit beside
       the logo in .brand-words, and printing them twice is what the crop
       removes.

       EMBEDDED rather than referenced: an external image inside a favicon
       does not load in any browser. The file keeps its name because
       sw.js precaches "/favicon.svg" by that path — deleting it would
       fail the service worker install and take the whole PWA down with
       it.

       make_icon.py still DRAWS a flat ellipse and is kept only for the
       token reader two other test files import. Nothing it draws ships.
       Rebuild this and the header logo from tools/appicons.sh. -->
