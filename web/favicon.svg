<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Qellys Book. The mark is the venue bowl ellipse — literally the
       smallest scale of the venue system in web/js/visuals.js, which means
       the logo and the product are the same idea. Redesign spec §6.1.

       It replaces the geometric Q, which said nothing about what this is
       and read as a magnifying glass at 16px.

       Flat tile, one stroke, no gradient: the same chrome as everything
       else. Colours are --panel-2 and --gold from web/css/styles.css.
       Identical geometry to the header tile in index.html and to
       apple-touch-icon.png — change all three together, or the tab, the
       home screen and the page stop looking like one brand. -->
  <rect width="48" height="48" fill="#161626"/>
  <g fill="none" stroke="#F5B93B" stroke-width="3.4">
    <ellipse cx="24" cy="24" rx="17" ry="11.5"/>
  </g>
</svg>
