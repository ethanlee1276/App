<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Qellys Book. Flat panel + one thin accent stroke, because that is the
       whole design system: hairline borders, no gradients, one calm blue.
       Colours are --panel-2 and --brand from web/css/styles.css.

       Identical geometry to the header tile in index.html and to
       apple-touch-icon.png — change all three together, or the tab, the
       home screen and the page stop looking like one brand. -->
  <rect width="48" height="48" rx="11" fill="#16171d"/>
  <g fill="none" stroke="#e6dccb" stroke-width="3.5" transform="translate(0 2)">
    <circle cx="24" cy="22" r="14"/>
    <path d="M30.36 28.36 L36.73 34.73"/>
  </g>
</svg>
